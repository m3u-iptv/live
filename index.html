<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Multi-Quality Video Player</title>
    <!-- Plyr Video Player ki Premium CSS -->
    <link rel="stylesheet" href="https://plyr.io" />
    <style>
        body { 
            background-color: #0f0f0f; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: sans-serif;
        }
        .player-container { 
            width: 90%; 
            max-width: 850px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="player-container">
    <!-- Video Player Tag -->
    <video id="player" controls crossorigin playsinline></video>
</div>

<!-- HLS aur Plyr Player ki Scripts -->
<script src="https://jsdelivr.net"></script>
<script src="https://plyr.io"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.querySelector('#player');
        
        // Kyunki master.m3u8 hls_video folder ke andar hai:
        const source = './hls_video/master.m3u8'; 

        const defaultOptions = {
            controls: [
                'play-large', 'play', 'progress', 'current-time', 
                'duration', 'mute', 'volume', 'settings', 'fullscreen'
            ],
            settings: ['quality', 'speed']
        };

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(source);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                // Video ki saari qualities (360p, 480p) nikalna
                const availableQualities = hls.levels.map((l) => l.height);
                availableQualities.unshift(0); // 0 ka matlab 'Auto' quality option

                defaultOptions.quality = {
                    default: 0,
                    options: availableQualities,
                    forced: true,
                    onChange: (e) => updateQuality(e),
                };

                // Player ko shuru karna
                const player = new Plyr(video, defaultOptions);
            });

            hls.attachMedia(video);
            window.hls = hls;
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari browser ke liye direct support
            video.src = source;
            const player = new Plyr(video, defaultOptions);
        }

        // Jab user quality change karega tab yeh chalega
        function updateQuality(newQuality) {
            if (newQuality === 0) {
                window.hls.currentLevel = -1; // Auto select mode
            } else {
                window.hls.levels.forEach((level, levelIndex) => {
                    if (level.height === newQuality) {
                        window.hls.currentLevel = levelIndex;
                    }
                });
            }
        }
    });
</script>

</body>
</html>
