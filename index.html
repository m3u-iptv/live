<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>मेरी लाइव वीडियो स्ट्रीमिंग वेबसाइट</title>
    <!-- Shaka Player की स्क्रिप्ट -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { background-color: #111; color: white; text-align: center; font-family: Arial, sans-serif; }
        video { width: 80%; max-width: 800px; border: 2px solid #ff0055; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>मेरा लाइव वीडियो चैनल 🔴</h1>
    <!-- वीडियो प्लेयर -->
    <video id="video" controls autoplay></video>

    <script>
        async function initPlayer() {
            const video = document.getElementById('video');
            const player = new shaka.Player(video);
            
            try {
                // यहाँ अपनी output.mpd फाइल का नाम डालें (अगर दोनों एक ही फोल्डर में हैं)
                await player.load('output.mpd'); 
                console.log('वीडियो सफलतापूर्वक लोड हो गया!');
            } catch (e) {
                console.error('Error loading video', e);
            }
        }
        document.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
