<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mobile Live TV App</title>
    
    <!-- Video Player CSS (Online Library for M3U8 Video Support) -->
    <link href="https://zencdn.net" rel="stylesheet" />
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; margin: 0; padding: 10px; }
        h2 { text-align: center; color: #ff3333; margin-top: 10px; }
        
        /* Video Player Styling */
        .player-container { width: 100%; margin-bottom: 20px; display: none; background: #000; border-radius: 8px; overflow: hidden; }
        .video-js { width: 100% !important; height: 220px !important; }
        
        /* Categories Horizontal Slider */
        .category-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; margin-bottom: 15px; }
        .category-container::-webkit-scrollbar { display: none; } /* Hide scrollbar */
        .category-btn { background-color: #333; color: white; border: none; padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 14px; font-weight: bold; }
        .category-btn.active { background-color: #ff3333; }
        
        /* Channels List Layout */
        .channel-list { display: flex; flex-direction: column; gap: 10px; }
        .channel-card { display: flex; align-items: center; background-color: #1e1e1e; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid #2a2a2a; }
        .channel-card:active { background-color: #333; }
        .channel-logo { width: 45px; height: 45px; background-color: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; margin-right: 15px; color: #ff3333; border: 2px solid #ff3333; }
        .channel-info { flex-grow: 1; }
        .channel-info h3 { margin: 0; font-size: 16px; color: #fff; }
        .channel-info p { margin: 4px 0 0 0; font-size: 12px; color: #aaa; }
        .play-icon { color: #00ff00; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🪔 My Live TV App</h2>

    <!-- 1. VIDEO PLAYER -->
    <div class="player-container" id="playerBox">
        <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
            <p class="vjs-no-js">To view this video please enable JavaScript</p>
        </video>
    </div>

    <!-- 2. CATEGORIES BUTTONS -->
    <div class="category-container" id="categoryBox">
        <button class="category-btn active" onclick="filterCategory('All')">All</button>
        <button class="category-btn" onclick="filterCategory('News')">News</button>
        <button class="category-btn" onclick="filterCategory('Sports')">Sports</button>
        <button class="category-btn" onclick="filterCategory('Movies')">Movies</button>
    </div>

    <!-- 3. CHANNELS LIST -->
    <div class="channel-list" id="channelListBox">
        <!-- Channels dynamic roop se yahan load honge -->
    </div>

    <!-- MAIN JAVASCRIPT (Sahi Video Engine Library) -->
    <script src="https://zencdn.net"></script>
    
    <script>
        // === JAVASCRIPT LOGIC AUR DATA CODE ===
        
        // Channels Data: Yahan aapka naya DD News link lag chuka hai
        const allChannels = [
            { 
                name: "DD News", 
                category: "News", 
                lang: "Hindi", 
                logo: "DD", 
                url: "https://cdn.pishow.tv/ott/live/12/master.m3u8" // <-- Aapka bheja hua naya link yahan add ho gaya hai
            },
            { 
                name: "Sample Sports", 
                category: "Sports", 
                lang: "English", 
                logo: "SP", 
                url: "https://akamaihd.net" 
            },
            { 
                name: "Test Movies Channel", 
                category: "Movies", 
                lang: "Hindi", 
                logo: "MV", 
                url: "https://unified-streaming.com" 
            }
        ];

        let activeCategory = 'All';
        
        // Video player ko initialize kar rahe hain
        const player = videojs('my-video');

        // Screen par channels dikhane ka function
        function displayChannels() {
            const listBox = document.getElementById('channelListBox');
            listBox.innerHTML = ''; // Purani list clear karein

            // Filter logic
            const filtered = allChannels.filter(c => activeCategory === 'All' || c.category === activeCategory);

            // UI mein cards jodna
            filtered.forEach(channel => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.onclick = () => playChannel(channel.url);
                card.innerHTML = `
                    <div class="channel-logo">${channel.logo}</div>
                    <div class="channel-info">
                        <h3>${channel.name}</h3>
                        <p>${channel.lang} | ${channel.category}</p>
                    </div>
                    <div class="play-icon">▶</div>
                `;
                listBox.appendChild(card);
            });
        }

        // Category badalne ka function
        function filterCategory(category) {
            activeCategory = category;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === category);
            });
            displayChannels(); // Nayi list dikhayein
        }

        // Channel play karne ka function
        function playChannel(url) {
            document.getElementById('playerBox').style.display = 'block'; // Player box show karein
            player.src({ type: 'application/x-mpegURL', src: url }); // M3U8 link load karein
            player.play(); // Video start karein
            
            // Screen ko upar player tak scroll karein
            window.scrollTo({ top: 0, behavior: 'smooth' }); 
        }

        // App open hote hi sabse pehle channels list load ho jaye
        displayChannels();
    </script>
</body>
</html>
