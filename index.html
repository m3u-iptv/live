<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Multi-Quality Video Player</title>
    <!-- Plyr Video Player ki CSS -->
    <link rel="stylesheet" href="https://plyr.io" />
    <style>
        body { background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 80%; max-width: 800px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Video Tag jisme master.m3u8 chalega -->
    <video id="player" controls crossorigin playsinline></video>
</div>

<!-- HLS.js aur Plyr.js ki Libraries -->
<script src="https://jsdelivr.net"></script>
<script src="https://plyr.io"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.querySelector('#player');
        // APNI MASTER FILE KA SAHI PATH YAHAN DALEIN
        const source = './hls_video/master.m3u8'; 

        const defaultOptions = {};

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(source);
            
            // Quality options ko player settings me add karna
            hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                const availableQualities = hls.levels.map((l) => l.height);
                availableQualities.unshift(0); // 0 matlab 'Auto' quality

                defaultOptions.quality = {
                    default: 0,
                    options: availableQualities,
                    forced: true,
                    onChange: (e) => updateQuality(e),
                };

                // Player ko initialize karna
                const player = new Plyr(video, defaultOptions);
            });

            hls.attachMedia(video);
            window.hls = hls;
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari browser ke liye direct support
            video.src = source;
            const player = new Plyr(video, defaultOptions);
        }

        function updateQuality(newQuality) {
            if (newQuality === 0) {
                window.hls.currentLevel = -1; // Auto mode
            } else {
                window.hls.levels.forEach((level, levelIndex) => {
                    if (level.height === newQuality) {
                        window.hls.currentLevel = levelIndex;
                    }
                });
            }
        }
    });
</script>

</body>
</html>
