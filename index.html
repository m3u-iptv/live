<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My IPTV</title>
<style>
body{font-family:sans-serif;background:#f8f9fa;margin:0;padding:15px}
h2{text-align:center}
input{width:100%;padding:12px;font-size:16px;border:2px solid #007bff;border-radius:10px;outline:none;box-sizing:border-box}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px #ddd}
button{background:#007bff;color:#fff;border:0;padding:8px 14px;border-radius:8px}
video{width:100%;margin-top:15px;border-radius:10px;background:#000}
</style>
</head>
<body>
<h2>📺 My IPTV</h2>
<input id="search" placeholder="Search Channel..." onkeyup="filter()">
<video id="player" controls></video>
<div id="list">Loading...</div>

<script>
let channels=[];
async function load(){
  let res = await fetch('index.m3u');
  let text = await res.text();
  let lines = text.split('\n');
  for(let i=0;i<lines.length;i++){
    if(lines[i].startsWith('#EXTINF')){
      let name = lines[i].split(',')[1] || 'Channel';
      let url = lines[i+1]?.trim();
      if(url && url.startsWith('http')) channels.push({name:name.trim(),url});
    }
  }
  show(channels);
}
function show(list){
  document.getElementById('list').innerHTML = list.map(c=>`
    <div class="card"><b>${c.name}</b><button onclick="play('${c.url}')">Play</button></div>
  `).join('') || 'No Channel Found';
}
function filter(){
  let q = document.getElementById('search').value.toLowerCase();
  show(channels.filter(c=>c.name.toLowerCase().includes(q)));
}
function play(url){
  let v=document.getElementById('player');
  v.src=url; v.play();
  window.scrollTo(0,0);
}
load();
</script>
</body>
</html>
