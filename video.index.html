<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Quality Video Player</title>
    <style>
        body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; color: white; }
        .player-container { width: 90%; max-width: 720px; text-align: center; }
        video { width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(255,255,255,0.1); }
        select { margin-top: 15px; padding: 8px 15px; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="player-container">
    <video id="myVideo" controls>
        <!-- folder 'video hls' ke andar se 480p load hogi sabse pehle -->
        <source id="videoSource" src="video%20hls/video_480p.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <br>
    <label for="qualitySelect">Quality: </label>
    <select id="qualitySelect" onchange="changeQuality()">
        <!-- Folder path sahi kar diya hai -->
        <option value="video%20hls/video_480p.mp4" selected>480p (Standard)</option>
        <option value="video%20hls/video_360p.mp4">360p (Low)</option>
    </select>
</div>

<script>
function changeQuality() {
    var video = document.getElementById("myVideo");
    var source = document.getElementById("videoSource");
    var selector = document.getElementById("qualitySelect");
    
    var currentTime = video.currentTime; 
    var isPaused = video.paused;

    source.src = selector.value;
    video.load(); 
    
    video.onloadedmetadata = function() {
        video.currentTime = currentTime; 
        if (!isPaused) {
            video.play();
        }
    };
}
</script>

</body>
</html>
