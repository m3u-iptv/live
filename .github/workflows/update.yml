name: Auto Update EPG

on:
  schedule:
    - cron: '0 */6 * * *'  # Har 6 ghante me auto
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
            - run: python update.py
        continue-on-error: true
      - run: |
          git config user.name "EPG Bot"
          git config user.email "bot@epg.com"
          git add epg.xml.gz
          git commit -m "Auto update epg" || echo "No change"
          git push
