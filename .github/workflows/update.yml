name: Update EPG
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python merge.py
      - run: |
          git config user.name "EPG Bot"
          git config user.email "bot@bot.com"
          git add epg.xml.gz
          git commit -m "Update EPG" || true
          git push
