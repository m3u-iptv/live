name: Auto Update 5 Min

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python check.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add index.m3u
          git commit -m "auto update 5 min" || echo "koi change nahi"
          git push
