name: Auto Update index.m3u

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Latest From iptv-org
        run: |
          curl -L "https://iptv-org.github.io/iptv/index.m3u" -o index.m3u
      - name: Save
        run: |
          git config user.name "auto-bot"
          git config user.email "bot@github.com"
          git add index.m3u
          git commit -m "Auto Update index.m3u" || echo "No Change"
          git push
