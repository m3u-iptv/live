name: Auto Update EPG

on:
  schedule:
    - cron: '0 0 * * *' # Roz subah 5:30 AM IST
  workflow_dispatch:

permissions:
  contents: write # File save karne ki direct permission

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install libraries
        run: pip install requests beautifulsoup4

      - name: Run EPG Script
        run: python generate_epg.py

      - name: Commit and push epg.xml.gz
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add epg.xml.gz
          git commit -m "Update EPG $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
          
