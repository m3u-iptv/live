name: Auto Update Aastha EPG

on:
  schedule:
    # रोज़ सुबह 5:30 AM IST (00:00 UTC) पर ऑटोमैटिक अपडेट होगा
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run EPG Scraper
        run: python scraper.py

      - name: Commit and push epg.xml.gz
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add epg.xml.gz
          git add debug_sample.json || true
          git commit -m "Auto update Aastha EPG" || exit 0
          git push
          
