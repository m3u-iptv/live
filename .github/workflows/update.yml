name: Update EPG
on:
  schedule:
    - cron: '30 0 * * *'   # Subah 6:00 IST
    - cron: '30 12 * * *'  # Shaam 6:00 IST
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - run: python main.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add epg.xml.gz epg.xml
          git commit -m "auto update $(date)" || echo "no change"
          git push
