name: Auto Filter EPG
on:
  schedule:
    - cron: '0 */12 * * *' # हर 12 घंटे में अपने आप चलेगा
  workflow_dispatch: # आप मैन्युअली भी चला सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run EPG Filter
        run: python filter_epg.py
      - name: Save Light EPG to GitHub
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add light_epg.xml.gz
          git commit -m "Updated light EPG" || exit 0
          git push
